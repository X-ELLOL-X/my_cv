<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Languages</title>

    <link rel="icon" href="icon/translation.png">
    <link rel="stylesheet" href="css/languages.css">
</head>

<body>

<section class="languages-section">

    <h1 class="title">Languages</h1>
    <hr>

    <div class="languages-box">

        <div class="lang-card">
            <h2>Arabic</h2>
            <span class="level native">Native</span>
            <div class="bar">
                <div class="fill arabic"></div>
            </div>
        </div>

        <div class="lang-card">
            <h2>English</h2>
            <span class="level good">Good</span>
            <div class="bar">
                <div class="fill english"></div>
            </div>
        </div>

    </div>

</section>

</body>
</html>
